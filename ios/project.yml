name: OneHope
options:
  bundleIdPrefix: com.cinderandcrown
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    DEVELOPMENT_TEAM: GDNRT9DJ58
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  OneHopeKit:
    path: Packages/OneHopeKit
targets:
  OneHope:
    type: application
    platform: iOS
    sources:
      - path: OneHope
    dependencies:
      - package: OneHopeKit
        product: OneHopeCore
      - package: OneHopeKit
        product: OneHopeDesign
      - package: OneHopeKit
        product: OneHopeHome
      - package: OneHopeKit
        product: OneHopeWatch
      - package: OneHopeKit
        product: OneHopeGive
      - package: OneHopeKit
        product: OneHopeConnect
      - package: OneHopeKit
        product: OneHopeMore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cinderandcrown.onehope
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: One Hope
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: One Hope uses the camera to scan a kids check-in code.
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: One Hope adds events you choose to your calendar.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: GDNRT9DJ58
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
  OneHopeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OneHopeTests
    dependencies:
      - target: OneHope
      - package: OneHopeKit
        product: OneHopeCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cinderandcrown.onehope.tests
        DEVELOPMENT_TEAM: GDNRT9DJ58
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  OneHopeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OneHopeUITests
    dependencies:
      - target: OneHope
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cinderandcrown.onehope.uitests
        DEVELOPMENT_TEAM: GDNRT9DJ58
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
schemes:
  OneHope:
    shared: true
    build:
      targets:
        OneHope: all
        OneHopeTests: [test]
        OneHopeUITests: [test]
    test:
      targets:
        - OneHopeTests
        - OneHopeUITests
    run:
      config: Debug
    archive:
      config: Release
