disabled_rules:
  - line_length
  - todo
  - trailing_comma
opt_in_rules:
  - empty_count
force_cast: error
force_try: error
force_unwrapping: error
identifier_name:
  min_length:
    warning: 1
    error: 0
type_body_length:
  warning: 250
  error: 400
file_length:
  warning: 400
  error: 700
excluded:
  - Packages/OneHopeKit/.build
  - .build
reporter: emoji
